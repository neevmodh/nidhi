[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26" # v4-core PoolManager pins =0.8.26; everything compiles with one version
evm_version = "cancun"  # EIP-1153 transient storage
via_ir = false
ffi = false
bytecode_hash = "none"
optimizer = true
optimizer_runs = 800
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./offchain" },
  { access = "read-write", path = "./chains" },
]

[fuzz]
runs = 512
seed = "0x6e69646869" # deterministic fuzzing so `forge snapshot --check` is reproducible in CI

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
