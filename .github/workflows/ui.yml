name: ui

on:
  push:
    branches: [main]
    paths: ["ui/**", "chains/**", "deployments/**", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["ui/**", "chains/**", "deployments/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly: refresh the ledger snapshot so first visits replay only the last hour

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check:design
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ui/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
